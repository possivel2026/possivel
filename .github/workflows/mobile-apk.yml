name: Gerar APK de teste

on:
  push:
    branches: [codex/finalizar-app-mobile]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.1
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Gerar projeto Android nativo
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compilar APK de teste
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Possivel-Android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
