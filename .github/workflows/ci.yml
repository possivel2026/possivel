name: Validar projeto
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check script.js
      - run: node tests/static-check.mjs

  mobile-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Validar manifests e estrutura mobile
        run: |
          node -e "JSON.parse(require('fs').readFileSync('mobile/package.json')); JSON.parse(require('fs').readFileSync('mobile/app.json')); console.log('manifests ok')"
          node mobile/tests/static-check.mjs
      - name: Instalar dependências mobile
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Verificar TypeScript
        working-directory: mobile
        run: npm run typecheck
      - name: Gerar bundle Android de validação
        working-directory: mobile
        run: npx expo export --platform android --output-dir dist
