name: Validar projeto
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check script.js
      - run: node tests/static-check.mjs
  mobile-manifests:
    if: ${{ hashFiles('mobile/package.json') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node -e "JSON.parse(require('fs').readFileSync('mobile/package.json')); JSON.parse(require('fs').readFileSync('mobile/app.json')); console.log('manifests ok')"
