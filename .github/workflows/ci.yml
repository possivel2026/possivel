name: Validar projeto
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - name: Validar JavaScript web
        run: |
          node --check script.js
          node --check enhancements.js
          node --check site-experience.js
      - name: Auditoria estática web/backend
        run: node tests/static-check.mjs

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verificar TypeScript das Edge Functions
        run: find supabase/functions -name '*.ts' -print0 | xargs -0 deno check

  mobile-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Validar manifests e estrutura mobile
        run: |
          node -e "JSON.parse(require('fs').readFileSync('mobile/package.json')); JSON.parse(require('fs').readFileSync('mobile/app.json')); console.log('manifests ok')"
          node mobile/tests/static-check.mjs
      - name: Instalar dependências mobile
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Verificar compatibilidade Expo
        working-directory: mobile
        run: npx expo install --check
      - name: Auditar dependências de produção
        working-directory: mobile
        run: node scripts/security-audit.mjs
      - name: Verificar TypeScript
        working-directory: mobile
        run: npm run typecheck
      - name: Verificar lint
        working-directory: mobile
        run: npm run lint
      - name: Executar testes mobile
        working-directory: mobile
        run: npm test
      - name: Gerar bundle Android de validação
        working-directory: mobile
        run: npx expo export --platform android --output-dir dist
